[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiro"
version = "0.1.0"
description = "AI resume tailoring assistant with a no-fabrication contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pdfplumber>=0.11,<1.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "reportlab>=4.2,<5.0",
    "starlette>=0.41,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
